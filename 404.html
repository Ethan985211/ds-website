<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · DS Agent</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1f18">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2324584A'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='28' font-weight='700' text-anchor='middle' fill='%23FFFFFF'%3EDS%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0d1f18;--ink:#f4f7f4;--muted:rgba(244,247,244,.78);--green:#8fb8a6}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;text-align:center;padding:40px 24px;
  background:radial-gradient(120% 90% at 50% 0%,#163229 0%,var(--bg) 62%);
  color:var(--ink);
  font-family:"MiSans","PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  line-height:1.8;
}
.mark{width:56px;height:56px;border-radius:14px;background:#24584a;display:grid;place-items:center;
  font-family:Georgia,serif;font-size:22px;font-weight:700;color:#fff;margin-bottom:36px}
code{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;font-size:clamp(64px,16vw,132px);
  font-weight:800;letter-spacing:-.04em;line-height:1;color:transparent;
  background:linear-gradient(180deg,#d7ebe0,#8fb8a6);-webkit-background-clip:text;background-clip:text}
h1{font-size:clamp(18px,2.4vw,22px);font-weight:600;letter-spacing:.06em;margin:26px 0 10px}
p{font-size:14px;color:var(--muted);letter-spacing:.03em;max-width:32em}
p+p{margin-top:4px;font-size:13px;color:rgba(244,247,244,.5)}
a.btn{display:inline-flex;align-items:center;gap:10px;margin-top:36px;
  padding:13px 34px;border-radius:8px;background:var(--green);color:#0d1f18;
  font-size:15px;font-weight:700;letter-spacing:.06em;text-decoration:none;
  transition:transform .2s ease,opacity .2s ease}
a.btn:hover{transform:translateY(-2px);opacity:.92}
a.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
  <div class="mark">DS</div>
  <code>404</code>
  <h1>这个页面不在了</h1>
  <p>链接可能已失效，或地址有误。</p>
  <p>The page you're looking for doesn't exist.</p>
  <a class="btn" href="/">返回首页 · Back home</a>
</body>
</html>
